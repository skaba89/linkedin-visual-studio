# ─── HERMES Local Development with PostgreSQL ────────────────────────
# Usage: docker compose up -d
# Then set DATABASE_URL=postgresql://hermes:hermes@localhost:5432/hermes

services:
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
