# ─── Render Blueprint for HERMES ─────────────────────────────────────
# Database: Neon (serverless PostgreSQL) — DATABASE_URL set manually
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── Web Service (Next.js) ────────────────────────────────────────
  - type: web
    name: hermes-app
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false         # Neon PostgreSQL connection string
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ENCRYPTION_KEY
        sync: false         # openssl rand -hex 32
      - key: NEXTAUTH_SECRET
        sync: false         # openssl rand -base64 32
      - key: NEXTAUTH_URL
        sync: false         # https://linkedin-visual-studio.onrender.com
      - key: AUTH_TRUST_HOST
        value: "true"       # NextAuth v4: trust X-Forwarded-Host header from Render's proxy
                            # Without this, getServerSession() returns null on cross-origin
                            # redirects (e.g. LinkedIn OAuth callback) because NextAuth
                            # falls back to the internal bind address (0.0.0.0:10000).
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health
