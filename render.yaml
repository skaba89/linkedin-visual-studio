# ─── Render Blueprint for HERMES ─────────────────────────────────────
# Deploy: https://dashboard.render.com → New → Blueprint → Connect repo
# Docs: https://render.com/docs/blueprint-spec

databases:
  # ─── PostgreSQL Database ──────────────────────────────────────────
  - name: hermes-db
    plan: starter          # $7/mo — 1 GB RAM, 1 vCPU, 10 GB storage
    ipAllowList: []        # Allow all (Render internal networking)

services:
  # ─── Web Service (Next.js) ────────────────────────────────────────
  - type: web
    name: hermes-app
    runtime: node
    plan: starter          # $7/mo — 512 MB RAM, 0.5 vCPU
    region: frankfurt      # Closest to EU users
    branch: main
    buildCommand: bash build.sh
    startCommand: node .next/standalone/server.js
    envVars:
      # ─── Auto-injected by Render ────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: hermes-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ─── Secrets (set manually in Render dashboard) ──────────────
      - key: ENCRYPTION_KEY
        sync: false         # Set manually: openssl rand -hex 32
      - key: NEXTAUTH_SECRET
        sync: false         # Set manually: openssl rand -base64 32
      - key: NEXTAUTH_URL
        sync: false         # Set after first deploy: https://hermes-app-xxxx.onrender.com
      # ─── Optional API keys for LLM providers ────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health
